name: Publish PyPI

# Auto-publish the Python package when a release is published. The package
# version lives in runtime/python/pyproject.toml.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: pipx install build && cd runtime/python && python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: runtime/python/dist/
          password: ${{ secrets.PYPI_TOKEN }}
