name: docker

# Build + push the runtime image (engine + MCP server) to GHCR.
#
# Trigger: after the "Engine builds" workflow completes for a tag — the
# image build downloads the engine zip and ghostcloak-mcp binary from
# the release assets, which only exist once engine-build (and
# runtime-build) have finished. Releasing on `release: published` fired
# ~2h too early (before assets landed) and always failed.

on:
  workflow_run:
    workflows: ["Engine builds"]
    types: [completed]
    branches: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the image from (e.g. v0.7.3)"
        required: true

jobs:
  build-and-push:
    # Only run when the engine build for a tag succeeded, or on manual dispatch.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image for ${TAG}"

      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # engine zip (2h build) + ghostcloak-mcp (15min build) must both
          # be attached before the image can be built. Normally they are
          # already here; poll up to 30 min as a safety net.
          for i in $(seq 1 60); do
            ASSETS=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
            ENGINE_OK=$(echo "$ASSETS" | grep -c 'lin\.x86_64\.zip' || true)
            RUNTIME_OK=$(echo "$ASSETS" | grep -c '^ghostcloak-mcp$' || true)
            if [ "$ENGINE_OK" -ge 1 ] && [ "$RUNTIME_OK" -ge 1 ]; then
              echo "assets ready: engine=$ENGINE_OK runtime=$RUNTIME_OK"
              exit 0
            fi
            echo "waiting for assets (engine=$ENGINE_OK runtime=$RUNTIME_OK, attempt $i/60)..."
            sleep 30
          done
          echo "::error::release $TAG is missing engine or ghostcloak-mcp assets"
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GHOSTFOX_VERSION=${{ steps.rel.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.rel.outputs.tag }}
