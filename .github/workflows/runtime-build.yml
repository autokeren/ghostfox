name: runtime-build

# Builds the Rust MCP runtime (ghostfox-mcp) as release assets for
# linux x86_64 and linux arm64 (native arm runner).
#
# Why a container build? The binary links onnxruntime static libs from
# `ort` download-binaries, which require glibc >= 2.38 / GCC 13 libstdc++.
# Building inside ubuntu:24.04 guarantees a binary that also runs inside
# the ubuntu:24.04 Docker image (Dockerfile) and on modern hosts.
# Asset names: "ghostfox-mcp" (x86_64) and "ghostfox-mcp-arm64" —
# the Dockerfile, install.sh and the Python/npm SDKs look for these names.

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: ghostfox-mcp
            container: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            asset: ghostfox-mcp-arm64
            container: ubuntu:24.04
          - runner: windows-2022
            asset: ghostfox-mcp.exe
            container: windows
          - runner: macos-14
            asset: ghostfox-mcp-darwin
            container: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build on Windows (native cargo)
        if: matrix.container == 'windows'
        shell: pwsh
        run: |
          rustup default stable
          cd runtime
          cargo build --release -p ghostfox-mcp
          Copy-Item target\release\ghostfox-mcp.exe -Destination "$env:RUNNER_TEMP\${{ matrix.asset }}"
          Get-Item "$env:RUNNER_TEMP\${{ matrix.asset }}"

      - name: Build on macOS (native cargo)
        if: matrix.container == 'macos'
        run: |
          rustup default stable
          cd runtime
          cargo build --release -p ghostfox-mcp
          cp target/release/ghostfox-mcp "$RUNNER_TEMP/${{ matrix.asset }}"
          ls -la "$RUNNER_TEMP/${{ matrix.asset }}"

      - name: Build inside ubuntu:24.04 (native arch)
        if: matrix.container != 'windows'
        run: |
          docker run --rm \
            -v "$PWD/runtime:/src:ro" \
            -v /tmp/gf-cargo:/cargo \
            -v /tmp/gf-target:/target \
            -v /tmp/gf-out:/out \
            -e CARGO_HOME=/cargo \
            ubuntu:24.04 \
            bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null 2>&1
              apt-get install -y -qq --no-install-recommends \
                curl ca-certificates build-essential pkg-config libssl-dev >/dev/null 2>&1
              export PATH="/cargo/bin:$PATH"
              if [ ! -x /cargo/bin/cargo ]; then
                curl -sSf https://sh.rustup.rs -o /tmp/rustup.sh
                sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path >/dev/null 2>&1
              fi
              rustup default stable >/dev/null 2>&1
              mkdir -p /work
              (cd /src && tar --exclude=./target -cf - .) | tar -xf - -C /work
              cd /work
              cargo build --release -p ghostfox-mcp --target-dir /target 2>&1 | tail -5
              strip /target/release/ghostfox-mcp
              cp /target/release/ghostfox-mcp /out/ghostfox-mcp
            '
          sudo chown -R "$(id -u):$(id -g)" /tmp/gf-out
          if [ "${{ matrix.asset }}" != "ghostfox-mcp" ]; then
            mv /tmp/gf-out/ghostfox-mcp "/tmp/gf-out/${{ matrix.asset }}"
          fi
          ls -la "/tmp/gf-out/${{ matrix.asset }}"

      - name: Attach to release (linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.container != 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/gf-out/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to release (windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.container == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
