[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostfox"
version = "0.7.0"
description = "Ghostfox — the agent-native stealth browser with 8 captcha solver families, debug cortex (console/errors/network), and MCP tools for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "autokeren" }]
keywords = ["browser", "stealth", "anti-detect", "mcp", "ai-agents", "scraping", "captcha", "captcha-solver", "geetest", "hcaptcha", "turnstile", "debugging", "console-capture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Repository = "https://github.com/autokeren/ghostfox"

[tool.setuptools.packages.find]
include = ["ghostfox*"]
