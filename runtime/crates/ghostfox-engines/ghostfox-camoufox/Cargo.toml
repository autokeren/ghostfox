[package]
name = "ghostfox-camoufox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Camoufox (patched Firefox) engine adapter for ghostfox"

[dependencies]
ghostfox-core = { path = "../../ghostfox-core" }
ghostfox-fingerprint = { path = "../../ghostfox-fingerprint" }
toml = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
chrono.workspace = true
rand.workspace = true
os_pipe.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
