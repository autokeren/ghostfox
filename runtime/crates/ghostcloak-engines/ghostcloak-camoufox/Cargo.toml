[package]
name = "ghostcloak-camoufox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Camoufox (patched Firefox) engine adapter for ghostcloak"

[dependencies]
ghostcloak-core = { path = "../../ghostcloak-core" }
ghostcloak-fingerprint = { path = "../../ghostcloak-fingerprint" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
chrono.workspace = true
rand.workspace = true
os_pipe.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
