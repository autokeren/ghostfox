[package]
name = "ghostfox-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing ghostfox browser sessions to AI agents"

[[bin]]
name = "ghostfox-mcp"
path = "src/main.rs"

[lib]
name = "ghostfox_mcp"
path = "src/lib.rs"

[dependencies]
ghostfox-core = { path = "../ghostfox-core" }
ghostfox-fingerprint = { path = "../ghostfox-fingerprint" }
ghostfox-chromium = { path = "../ghostfox-engines/ghostfox-chromium" }
ghostfox-camoufox = { path = "../ghostfox-engines/ghostfox-camoufox" }
rmcp.workspace = true
schemars = "1"
toml.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
base64.workspace = true
ocrs.workspace = true
rten.workspace = true
rten-tensor = "0.26"
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "ndarray"] }
ndarray = "0.16"
rten-imageproc.workspace = true
image.workspace = true
once_cell.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
