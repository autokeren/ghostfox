[workspace]
resolver = "2"
members = [
    "crates/ghostcloak-core",
    "crates/ghostcloak-mcp",
    "crates/ghostcloak-fingerprint",
    "crates/ghostcloak-engines/ghostcloak-chromium",
    "crates/ghostcloak-engines/ghostcloak-camoufox",
    "crates/ghostcloak-eval",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ghostcloak/ghostcloak"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chromiumoxide = { version = "0.9", default-features = false }
rmcp = { version = "0.3", features = ["server", "transport-io", "macros", "schemars"] }
futures = "0.3"
async-trait = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
command-fds = "0.3"
os_pipe = "1"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Dev builds skip the incremental cache: it grows unbounded on this box and
# disk is the scarce resource here.
[profile.dev]
incremental = false
